name: Android 동반 앱

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: 단위 테스트 (PC와 같은 서명·해시 계산인지)
        run: gradle testDebugUnitTest --no-daemon
      - name: 서명 키 준비 (저장소 비밀값이 있으면)
        env:
          KEYSTORE_B64: ${{ secrets.SYNCMUSIC_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/syncmusic.p12"
            echo "SYNCMUSIC_KEYSTORE=$RUNNER_TEMP/syncmusic.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::서명 키 비밀값이 없어서 임시 디버그 키로 서명해요. 새 버전을 설치하려면 앱을 지우고 다시 설치해야 해요."
          fi
      - name: APK 빌드
        env:
          SYNCMUSIC_KEYSTORE_PASSWORD: ${{ secrets.SYNCMUSIC_KEYSTORE_PASSWORD }}
        run: gradle assembleDebug --no-daemon
      - name: 서명 확인 (인증서 지문 출력)
        continue-on-error: true
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "build-tools: $BT"
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/debug/*.apk 2>&1 | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: syncmusic-companion-apk
          path: android/app/build/outputs/apk/debug/*.apk
