name: PC 플레이어

on:
  push:
    paths: ['pc/**', '.github/workflows/pc.yml']
  pull_request:
    paths: ['pc/**']
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pc/package-lock.json
      - run: npm ci
      - run: npm test
